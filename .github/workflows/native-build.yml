name: Native Multi-platform Build

on:
  push:
    tags:
      - native-v*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  prepare:
    name: Prepare build metadata
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read Native version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' native-prototype/Cargo.toml | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::无法从 native-prototype/Cargo.toml 读取版本号"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG_VERSION=${GITHUB_REF_NAME#native-v}
            if [ "$TAG_VERSION" = "$GITHUB_REF_NAME" ] || [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "::error::Native 标签版本 $GITHUB_REF_NAME 与 Cargo.toml 版本 $VERSION 不一致"
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Native version: $VERSION"

  quality:
    name: Native quality gates
    needs: prepare
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: native-prototype
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-prototype
          shared-key: native-linux-quality

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libssl-dev pkg-config

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets

      - name: Run tests
        run: cargo test --locked

  build:
    name: Build ${{ matrix.display }}
    needs:
      - prepare
      - quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - display: Linux x86_64
            runner: ubuntu-22.04
            slug: linux-x86_64
            formats: deb
            artifact: LiteTerm-Native-Linux
          - display: Windows x86_64
            runner: windows-2022
            slug: windows-x86_64
            formats: nsis,wix
            artifact: LiteTerm-Native-Windows
          - display: macOS Intel
            runner: macos-15-intel
            slug: macos-x86_64
            formats: dmg
            artifact: LiteTerm-Native-macOS-Intel
            package_arch: x64
          - display: macOS Apple Silicon
            runner: macos-15
            slug: macos-aarch64
            formats: dmg
            artifact: LiteTerm-Native-macOS-Apple-Silicon
            package_arch: aarch64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: native-prototype
    env:
      BUILD_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-prototype
          shared-key: native-${{ matrix.slug }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libssl-dev pkg-config

      - name: Install Windows NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build Linux installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          rm -rf dist/installers
          cargo packager --release --formats "${{ matrix.formats }}" --verbose
          PACKAGE=$(find dist/installers -maxdepth 1 -type f -name '*.deb' -print -quit)
          if [ -z "$PACKAGE" ]; then
            echo "::error::cargo-packager 未生成 .deb 安装包"
            exit 1
          fi
          mv "$PACKAGE" "dist/installers/LiteTerm-Native_${BUILD_VERSION}_amd64.deb"

      - name: Build Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path dist/installers) {
            Remove-Item -Recurse -Force dist/installers
          }
          cargo packager --release --formats "${{ matrix.formats }}" --verbose
          $exe = Get-ChildItem -Path dist/installers -Filter *.exe -File | Select-Object -First 1
          $msi = Get-ChildItem -Path dist/installers -Filter *.msi -File | Select-Object -First 1
          if (-not $exe) { throw "cargo-packager 未生成 NSIS .exe 安装包" }
          if (-not $msi) { throw "cargo-packager 未生成 WiX .msi 安装包" }
          Move-Item $exe.FullName "dist/installers/LiteTerm-Native_${env:BUILD_VERSION}_x64-setup.exe"
          Move-Item $msi.FullName "dist/installers/LiteTerm-Native_${env:BUILD_VERSION}_x64.msi"

      - name: Build macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rm -rf dist/installers
          cargo packager --release --formats "${{ matrix.formats }}" --verbose
          PACKAGE=$(find dist/installers -maxdepth 1 -type f -name '*.dmg' -print -quit)
          if [ -z "$PACKAGE" ]; then
            echo "::error::cargo-packager 未生成 .dmg 安装包"
            exit 1
          fi
          mv "$PACKAGE" "dist/installers/LiteTerm-Native_${BUILD_VERSION}_${{ matrix.package_arch }}.dmg"

      - name: Verify installer output
        shell: bash
        run: |
          echo "Generated installers for ${{ matrix.display }}:"
          find dist/installers -maxdepth 1 -type f -print

      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-v${{ needs.prepare.outputs.version }}
          path: |
            native-prototype/dist/installers/*.exe
            native-prototype/dist/installers/*.msi
            native-prototype/dist/installers/*.deb
            native-prototype/dist/installers/*.dmg
          if-no-files-found: error
          retention-days: 30

  summary:
    name: Publish download guide
    if: always()
    needs:
      - prepare
      - quality
      - build
    runs-on: ubuntu-22.04
    steps:
      - name: Write run summary
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          {
            echo "## LiteTerm Native 编译产物"
            echo
            echo "- 版本：\`$VERSION\`"
            echo "- 触发来源：\`${GITHUB_REF_NAME}\`"
            echo "- 质量检查：\`$QUALITY_RESULT\`"
            echo "- 三端构建：\`$BUILD_RESULT\`"
            echo
            if [ "$BUILD_RESULT" = "success" ]; then
              echo "### 网页下载位置"
              echo
              echo "在当前 Actions 运行页面向下滚动到 **Artifacts**，下载以下目录："
              echo
              echo "- \`LiteTerm-Native-Windows-v$VERSION\`：NSIS \`.exe\` 与 WiX \`.msi\`"
              echo "- \`LiteTerm-Native-Linux-v$VERSION\`：Debian/Ubuntu \`.deb\`"
              echo "- \`LiteTerm-Native-macOS-Intel-v$VERSION\`：Intel \`.dmg\`"
              echo "- \`LiteTerm-Native-macOS-Apple-Silicon-v$VERSION\`：Apple Silicon \`.dmg\`"
              echo
              echo "产物保留 30 天，每个目录中直接包含对应平台的安装包。"
            else
              echo "构建未全部通过，因此可能没有完整的可下载产物；请先检查失败的 job。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
