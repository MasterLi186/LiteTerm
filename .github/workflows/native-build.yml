name: LiteTerm Multi-platform Build

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liteterm-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  prepare:
    name: Prepare build metadata
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::无法从 Cargo.toml 读取版本号"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG_VERSION=${GITHUB_REF_NAME#v}
            if [ "$TAG_VERSION" = "$GITHUB_REF_NAME" ] || [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "::error::标签版本 $GITHUB_REF_NAME 与 Cargo.toml 版本 $VERSION 不一致"
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version: $VERSION"

  quality:
    name: Compile checks
    needs: prepare
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: native-linux-quality

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libssl-dev pkg-config

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --bin liteterm-native

  build:
    name: Build ${{ matrix.display }}
    needs:
      - prepare
      - quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - display: Linux x86_64
            runner: ubuntu-22.04
            slug: linux-x86_64
            formats: deb
            artifact: LiteTerm-Linux
          - display: Windows x86_64
            runner: windows-2022
            slug: windows-x86_64
            formats: nsis
            artifact: LiteTerm-Windows
          - display: macOS Intel
            runner: macos-15-intel
            slug: macos-x86_64
            formats: dmg
            artifact: LiteTerm-macOS-Intel
            package_arch: x64
          - display: macOS Apple Silicon
            runner: macos-15
            slug: macos-aarch64
            formats: dmg
            artifact: LiteTerm-macOS-Apple-Silicon
            package_arch: aarch64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: .
    env:
      BUILD_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: native-${{ matrix.slug }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libssl-dev pkg-config

      - name: Install Windows NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build Linux installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          rm -rf dist/installers
          cargo packager --release --formats "${{ matrix.formats }}" --verbose
          PACKAGE=$(find dist/installers -maxdepth 1 -type f -name '*.deb' -print -quit)
          if [ -z "$PACKAGE" ]; then
            echo "::error::cargo-packager 未生成 .deb 安装包"
            exit 1
          fi
          mv "$PACKAGE" "dist/installers/LiteTerm_${BUILD_VERSION}_amd64.deb"

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path dist/installers) {
            Remove-Item -Recurse -Force dist/installers
          }
          cargo packager --release --formats "${{ matrix.formats }}" --verbose
          $exe = Get-ChildItem -Path dist/installers -Filter *.exe -File | Select-Object -First 1
          if (-not $exe) { throw "cargo-packager 未生成 NSIS .exe 安装包" }
          Move-Item $exe.FullName "dist/installers/LiteTerm_${env:BUILD_VERSION}_x64-setup.exe"

      - name: Build macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rm -rf dist/installers
          # Build a proper ICNS bundle from the source PNG. cargo-packager's
          # ICNS mapper rejects the raw 1024x1024 PNG as an unmatched icon size.
          SOURCE=assets/icons/1024x1024.png
          ICONSET=assets/icons/LiteTerm.iconset
          mkdir -p "$ICONSET"
          sips -z 16 16 "$SOURCE" --out "$ICONSET/icon_16x16.png" >/dev/null
          sips -z 32 32 "$SOURCE" --out "$ICONSET/icon_16x16@2x.png" >/dev/null
          sips -z 32 32 "$SOURCE" --out "$ICONSET/icon_32x32.png" >/dev/null
          sips -z 64 64 "$SOURCE" --out "$ICONSET/icon_32x32@2x.png" >/dev/null
          sips -z 128 128 "$SOURCE" --out "$ICONSET/icon_128x128.png" >/dev/null
          sips -z 256 256 "$SOURCE" --out "$ICONSET/icon_128x128@2x.png" >/dev/null
          sips -z 256 256 "$SOURCE" --out "$ICONSET/icon_256x256.png" >/dev/null
          sips -z 512 512 "$SOURCE" --out "$ICONSET/icon_256x256@2x.png" >/dev/null
          sips -z 512 512 "$SOURCE" --out "$ICONSET/icon_512x512.png" >/dev/null
          sips -z 1024 1024 "$SOURCE" --out "$ICONSET/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "$ICONSET" -o assets/icons/icon.icns
          rm -rf -- "$ICONSET"
          test -s assets/icons/icon.icns
          python3 - <<'PY'
          from pathlib import Path

          cargo_toml = Path("Cargo.toml")
          contents = cargo_toml.read_text()
          start = contents.find("icons = [")
          end = contents.find("]", start)
          if start < 0 or end < 0:
              raise SystemExit("Could not locate the icon list")
          contents = contents[:start] + 'icons = ["assets/icons/icon.icns"]' + contents[end + 1:]
          cargo_toml.write_text(contents)
          PY
          # cargo-packager's create-dmg helper mounts and ejects a temporary
          # image.  GitHub's macOS Intel runner can intermittently keep that
          # image busy, leaving an otherwise valid build marked as failed.
          # Build the .app with cargo-packager and create the DMG directly via
          # hdiutil instead; this avoids mounting an intermediate image.
          cargo packager --release --formats app --verbose
          APP=$(find dist/installers -maxdepth 1 -type d -name '*.app' -print -quit)
          if [ -z "$APP" ]; then
            echo "::error::cargo-packager 未生成 macOS .app 应用包"
            exit 1
          fi
          STAGING=$(mktemp -d)
          trap 'rm -rf "$STAGING"' EXIT
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          PACKAGE="dist/installers/LiteTerm_${BUILD_VERSION}_${{ matrix.package_arch }}.dmg"
          hdiutil create \
            -volname "LiteTerm" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            "$PACKAGE"
          test -f "$PACKAGE"

      - name: Verify installer output
        shell: bash
        run: |
          echo "Generated installers for ${{ matrix.display }}:"
          find dist/installers -maxdepth 1 -type f -print

      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-v${{ needs.prepare.outputs.version }}
          path: |
            dist/installers/*.exe
            dist/installers/*.deb
            dist/installers/*.dmg
          if-no-files-found: error
          retention-days: 30

  summary:
    name: Publish download guide
    if: always()
    needs:
      - prepare
      - quality
      - build
    runs-on: ubuntu-22.04
    steps:
      - name: Write run summary
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          {
            echo "## LiteTerm 编译产物"
            echo
            echo "- 版本：\`$VERSION\`"
            echo "- 触发来源：\`${GITHUB_REF_NAME}\`"
            echo "- 编译检查：\`$QUALITY_RESULT\`"
            echo "- 三端构建：\`$BUILD_RESULT\`"
            echo
            if [ "$BUILD_RESULT" = "success" ]; then
              echo "### 网页下载位置"
              echo
              echo "在当前 Actions 运行页面向下滚动到 **Artifacts**，下载以下目录："
              echo
              echo "- \`LiteTerm-Windows-v$VERSION\`：简体中文 NSIS \`.exe\`"
              echo "- \`LiteTerm-Linux-v$VERSION\`：Debian/Ubuntu \`.deb\`"
              echo "- \`LiteTerm-macOS-Intel-v$VERSION\`：Intel \`.dmg\`"
              echo "- \`LiteTerm-macOS-Apple-Silicon-v$VERSION\`：Apple Silicon \`.dmg\`"
              echo
              echo "产物保留 30 天，每个目录中直接包含对应平台的安装包。"
            else
              echo "构建未全部通过，因此可能没有完整的可下载产物；请先检查失败的 job。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs:
      - prepare
      - build
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release changelog
        id: changelog
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          DOWNLOAD_BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          PREV_TAG="$(git tag --sort=-creatordate | grep -E '^(native-)?v0\.1\.' | grep -v "^${TAG}$" | head -1 || true)"

          if [ -z "$PREV_TAG" ]; then
            COMMITS="$(git log --pretty=format:"%h %s" -50)"
            COMPARE=""
          else
            COMMITS="$(git log --pretty=format:"%h %s" "${PREV_TAG}..${TAG}")"
            COMPARE="**完整对比**：https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
          fi

          FEAT=""
          FIX=""
          OTHER=""
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            hash="${line%% *}"
            msg="${line#* }"
            if [[ "$msg" == feat:* ]]; then
              FEAT+="- ✨ ${msg} (${hash})"$'\n'
            elif [[ "$msg" == fix:* ]]; then
              FIX+="- 🐛 ${msg} (${hash})"$'\n'
            elif [[ "$msg" == chore:* || "$msg" == docs:* || "$msg" == refactor:* || "$msg" == perf:* ]]; then
              OTHER+="- 📝 ${msg} (${hash})"$'\n'
            else
              OTHER+="- ${msg} (${hash})"$'\n'
            fi
          done <<< "$COMMITS"

          TOTAL="$(printf '%s\n' "$COMMITS" | grep -c . || true)"

          {
            echo "body<<ENDOFLOG"
            echo "## 更新内容"
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "对比 \`${PREV_TAG}\` → \`${TAG}\`，共 ${TOTAL} 个提交。"
            else
              echo "初始版本，共 ${TOTAL} 个提交。"
            fi
            echo
            if [ -n "$FEAT" ]; then
              echo "### 新功能"
              echo
              printf '%s\n' "$FEAT"
            fi
            if [ -n "$FIX" ]; then
              echo "### 修复"
              echo
              printf '%s\n' "$FIX"
            fi
            if [ -n "$OTHER" ]; then
              echo "### 其他"
              echo
              printf '%s\n' "$OTHER"
            fi
            echo "### 下载"
            echo
            echo "| 平台 | 安装包 |"
            echo "|---|---|"
            echo "| Linux x86_64 | [LiteTerm_${VERSION}_amd64.deb](${DOWNLOAD_BASE}/LiteTerm_${VERSION}_amd64.deb) |"
            echo "| Windows x86_64 | [LiteTerm_${VERSION}_x64-setup.exe](${DOWNLOAD_BASE}/LiteTerm_${VERSION}_x64-setup.exe) |"
            echo "| macOS Intel | [LiteTerm_${VERSION}_x64.dmg](${DOWNLOAD_BASE}/LiteTerm_${VERSION}_x64.dmg) |"
            echo "| macOS Apple Silicon | [LiteTerm_${VERSION}_aarch64.dmg](${DOWNLOAD_BASE}/LiteTerm_${VERSION}_aarch64.dmg) |"
            echo
            echo "安装包尚未进行商业代码签名，Windows 和 macOS 可能显示安全提示。"
            if [ -n "$COMPARE" ]; then
              echo
              echo "$COMPARE"
            fi
            echo "ENDOFLOG"
          } >> "$GITHUB_OUTPUT"

      - name: Download platform installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish direct-download installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LiteTerm v${{ needs.prepare.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          files: release-assets/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
