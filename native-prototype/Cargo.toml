[package]
name = "liteterm-native"
version = "0.1.0-memory.1"
edition = "2021"

[[bin]]
name = "liteterm-native"
path = "src/main.rs"

[lib]
name = "liteterm_native_api"
path = "src/api.rs"

[dependencies]
winit = "0.30"
wgpu = "24"
cosmic-text = "0.12"
alacritty_terminal = "0.25"
vte = "0.15"
portable-pty = "0.8"
pollster = "0.4"
log = "0.4"
env_logger = "0.11"
bytemuck = { version = "1", features = ["derive"] }
arboard = "3"
rfd = "0.16"
unicode-width = "0.2"
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = "0.31"
ssh2 = { version = "0.9", features = ["openssl-on-win32", "vendored-openssl"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
dirs = "6"
shellexpand = "3"
os_pipe = "1"
uuid = { version = "1", features = ["v4"] }
openssl = "0.10"
hex = "0.4"
hostname = "0.4"
whoami = "1"
serde_json = "1"
libc = "0.2"
sysinfo = "0.34"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"
tempfile = "3"
fs2 = "0.4"
serialport = "4"
crc32fast = "1"
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5", features = ["limit", "util"] }
subtle = "2"
